name: Release

# Builds the plugin package and publishes it as a GitHub release, started either way:
# - push a tag such as v0.1.0 or v0.1.0-beta.1 on a commit on main, or
# - run this workflow on main from the Actions tab (or the API) with a new tag name: the release is built
#   from the head of main and the tag is created with it.
# A tag with a suffix (-alpha.N, -beta.N, -rc.N) is published as a pre-release. Its version must match
# <Version> in the plugin's csproj.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: New tag to release from the head of main, e.g. v0.1.0-beta.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check the tag
        id: version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Run the release from main"
              exit 1
            fi
            # A tag on this commit is a retry of this release; one anywhere else is someone else's.
            if EXISTING="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}")" && [[ "$EXISTING" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $TAG already exists on another commit; pick a new one"
              exit 1
            fi
          fi
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Tag $TAG is not vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N"
            exit 1
          fi
          TAG_VERSION="${BASH_REMATCH[1]}"
          SUFFIX="${BASH_REMATCH[2]}"
          VERSION="$(dotnet msbuild src/BTCPayServer.Plugins.SweepSell -getProperty:Version)"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag $TAG doesn't match the plugin version $VERSION"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points at a commit that isn't on main"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ -n "$SUFFIX" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Test
        run: dotnet test --project tests/BTCPayServer.Plugins.SweepSell.Tests -c Release
      - name: Package
        run: scripts/pack.sh dist
      - name: Collect the release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release
          cp dist/BTCPayServer.Plugins.SweepSell/*/BTCPayServer.Plugins.SweepSell.btcpay \
             dist/BTCPayServer.Plugins.SweepSell/*/BTCPayServer.Plugins.SweepSell.btcpay.json \
             dist/BTCPayServer.Plugins.SweepSell/*/SHA256SUMS release/
          (cd release && sha256sum -c SHA256SUMS)
          # Release notes are the CHANGELOG.md section for this version.
          awk -v v="$VERSION" '/^## /{ if (p) exit; p = ($2 == v); next } p' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release/
            notes.md
          if-no-files-found: error

  # Publishing runs separately, so the build above (which restores packages and runs the tests) never
  # has a token that can write to the repository. This job runs no repository code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          FLAGS=()
          if [[ "$PRERELEASE" == "true" ]]; then FLAGS+=(--prerelease); fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Create the tag on the commit that was built and tested. GitHub refuses a name that already
            # exists, so a tag made by anyone else is never reused, while a retry of this run (after a failed
            # upload, say) finds its own tag on the same commit and carries on.
            if ! gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null; then
              read -r TYPE SHA < <(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha') || true
              if [[ "$TYPE" == "tag" ]]; then SHA="$(gh api "repos/$GH_REPO/git/tags/$SHA" --jq .object.sha)"; fi
              if [[ "$SHA" != "$GITHUB_SHA" ]]; then
                echo "::error::Tag $TAG already exists on another commit"
                exit 1
              fi
            fi
          fi
          gh release create "$TAG" --verify-tag --title "Sweep & Sell $TAG" --notes-file notes.md "${FLAGS[@]}" \
            release/BTCPayServer.Plugins.SweepSell.btcpay \
            release/BTCPayServer.Plugins.SweepSell.btcpay.json \
            release/SHA256SUMS
