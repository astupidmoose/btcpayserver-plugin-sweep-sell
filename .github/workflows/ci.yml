name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/BTCPayServer.Plugins.SweepSell -c Release
      - name: Test
        run: dotnet test --project tests/BTCPayServer.Plugins.SweepSell.Tests -c Release
      - name: Package
        run: scripts/pack.sh dist
